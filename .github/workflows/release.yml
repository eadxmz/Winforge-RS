name: Build & Release WinForge-RS Portable

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-portable-windows:
    name: Build Windows x64 Portable Bundle
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Ensure Cargo.lock Exists for Cache Keying
        shell: pwsh
        run: |
          if (-not (Test-Path "Cargo.lock")) {
              cargo generate-lockfile
          }

      - name: Cache Cargo Registry, Index & Compiled Target Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-all-crates: true
          save-if: true

      - name: Compile WinForge-RS (Release)
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Assemble Self-Contained Portable Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dist = "dist\WinForge-RS"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          # 1. Copy compiled WinForge-RS binary & README
          Copy-Item "target\x86_64-pc-windows-msvc\release\winforge-rs.exe" -Destination "$dist\winforge-rs.exe"
          if (Test-Path "README.md") {
              Copy-Item "README.md" -Destination "$dist\README.md"
          }

          # 2. Bundle Microsoft oscdimg.exe from the runner's pre-installed Windows ADK
          $adkPaths = @(
              "C:\Program Files (x86)\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe",
              "C:\Program Files\Windows Kits\10\Assessment and Deployment Kit\Deployment Tools\amd64\Oscdimg\oscdimg.exe"
          )
          $copiedOscdimg = $false
          foreach ($path in $adkPaths) {
              if (Test-Path $path) {
                  Copy-Item $path -Destination "$dist\oscdimg.exe"
                  Write-Host "Bundled oscdimg.exe from Windows ADK: $path"
                  $copiedOscdimg = $true
                  break
              }
          }
          if (-not $copiedOscdimg) {
              Write-Warning "ADK oscdimg.exe not found on runner; runtime toolchain bootstrapper will fetch it on first launch."
          }

          # 3. Bundle 7z.exe + 7z.dll from the runner
          if (Test-Path "C:\Program Files\7-Zip\7z.exe") {
              Copy-Item "C:\Program Files\7-Zip\7z.exe" -Destination "$dist\7z.exe"
              Copy-Item "C:\Program Files\7-Zip\7z.dll" -Destination "$dist\7z.dll"
              Write-Host "Bundled 7z.exe and 7z.dll from runner."
          }

          # 4. Compress into Portable ZIP & Generate SHA-256 Checksum
          $zipName = "WinForge-RS-Portable-x64.zip"
          Compress-Archive -Path "$dist\*" -DestinationPath $zipName -Force

          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "SHA256SUMS.txt" -Encoding utf8
          Write-Host "Generated $zipName (SHA256: $hash)"

      - name: Upload Portable ZIP to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinForge-RS-Portable-x64
          path: |
            WinForge-RS-Portable-x64.zip
            SHA256SUMS.txt

      - name: Publish Official GitHub Release (On Tag Push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            WinForge-RS-Portable-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
