[package]
name = "winforge-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
encoding_rs = "0.8"
regex = "1.11"
anyhow = "1.0"
base64 = "0.22"

[build-dependencies]
slint-build = "1.18"
embed-resource = "2.5"
